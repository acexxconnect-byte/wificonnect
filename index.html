<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Portal</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 24px;
            text-align: center;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        
        h2 { margin-top: 0; color: var(--dark); }
        .mac-display { font-size: 0.8rem; color: #64748b; margin-bottom: 20px; }

        /* Menu Styles */
        .tier-header {
            background: var(--dark);
            color: white;
            padding: 8px;
            border-radius: 6px;
            margin: 15px 0 10px 0;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .vip-header {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #fff;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-rate {
            background: var(--light);
            border: 2px solid #e2e8f0;
            padding: 12px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-rate:active { border-color: var(--primary); background: #eff6ff; }
        .price { color: var(--primary); font-size: 1.1rem; display: block; margin-top: 4px; }

        /* Dashboard Styles */
        .time-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--dark);
            margin: 20px 0;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .status-playing { background: #dcfce7; color: var(--success); }
        .status-paused { background: #fef3c7; color: var(--warning); }
        
        .btn-action {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-play { background: var(--success); }
        .btn-pause { background: var(--warning); }
        .btn-buy-more { background: var(--primary); }

        /* Queue Styles */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="mac-display" id="mac-address-label">Device: Unknown</div>

    <!-- SCREEN 1: LOADING & QUEUE -->
    <div id="screen-queue" class="screen active">
        <h2 id="queue-title">Connecting...</h2>
        <div class="spinner" id="queue-spinner"></div>
        <p id="queue-message">Checking your device status.</p>
        <button class="btn-action btn-buy-more" id="btn-join-queue" style="display:none;" onclick="joinQueue()">Buy Wi-Fi Time</button>
    </div>

    <!-- SCREEN 2: RATE MENU -->
    <div id="screen-menu" class="screen">
        <h2>Select Package</h2>
        <p style="font-size: 0.9rem; color: #64748b;">Hand your cash payment to the admin after tapping.</p>
        
        <div class="tier-header">📶 STANDARD (Up to 5 Mbps)</div>
        <div class="grid-menu">
            <button class="btn-rate" onclick="requestPlan('1H_5M', 5)">1 Hour <span class="price">₱5</span></button>
            <button class="btn-rate" onclick="requestPlan('3H_5M', 10)">3 Hours <span class="price">₱10</span></button>
            <button class="btn-rate" onclick="requestPlan('10H_5M', 20)">10 Hours <span class="price">₱20</span></button>
            <button class="btn-rate" onclick="requestPlan('1D_5M', 30)">1 Day <span class="price">₱30</span></button>
        </div>

        <div class="tier-header vip-header">⭐ VIP PROMO (Up to 10 Mbps)</div>
        <div class="grid-menu">
            <button class="btn-rate" onclick="requestPlan('3D_10M', 60)">3 Days <span class="price">₱60</span></button>
            <button class="btn-rate" onclick="requestPlan('7D_10M', 130)">7 Days <span class="price">₱130</span></button>
            <button class="btn-rate" onclick="requestPlan('15D_10M', 250)">15 Days <span class="price">₱250</span></button>
            <button class="btn-rate" onclick="requestPlan('30D_10M', 450)">30 Days <span class="price">₱450</span></button>
        </div>
    </div>

    <!-- SCREEN 3: DASHBOARD (PLAY/PAUSE) -->
    <div id="screen-dashboard" class="screen">
        <h2>Your Connection</h2>
        <div id="status-badge" class="status-badge status-paused">Paused</div>
        
        <div class="time-display" id="time-remaining">00:00</div>
        <p style="color: #64748b; margin-top: -15px; margin-bottom: 20px;">Remaining Time</p>

        <button class="btn-action btn-play" id="btn-play" onclick="toggleConnection('play')">▶ PLAY INTERNET</button>
        <button class="btn-action btn-pause" id="btn-pause" onclick="toggleConnection('pause')" style="display:none;">⏸ PAUSE TIME</button>
        <button class="btn-action btn-buy-more" onclick="joinQueue()" style="margin-top: 15px;">➕ Buy More Time</button>
    </div>
</div>

<script>
    // 1. Capture the MAC address Omada puts in the URL
    const urlParams = new URLSearchParams(window.location.search);
    let clientMac = urlParams.get('clientMac');
    
    // Fallback logic for testing without Omada
    if (!clientMac) {
        clientMac = localStorage.getItem('saved_mac') || 'TEST-MAC-' + Math.floor(Math.random() * 1000);
    }
    localStorage.setItem('saved_mac', clientMac);
    document.getElementById('mac-address-label').innerText = 'Device ID: ' + clientMac;

    // 2. Screen Navigation Function
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 3. Queue Logic
    function joinQueue() {
        // Just show the menu immediately. Don't hit the database yet.
        showScreen('screen-menu');
    }

    function requestPlan(planCode, price) {
        showScreen('screen-queue');
        document.getElementById('queue-title').innerText = 'Connecting...';
        document.getElementById('queue-spinner').style.display = 'block';
        document.getElementById('queue-message').innerText = `Requesting ₱${price} plan...`;
        
        // Join the line in the background, then update with the requested plan
        fetch(`/api?action=join&mac=${clientMac}`)
            .then(() => fetch(`/api?action=request&mac=${clientMac}&plan=${planCode}`))
            .then(() => {
                document.getElementById('queue-title').innerText = 'Waiting for Approval';
                document.getElementById('queue-spinner').style.display = 'none';
                document.getElementById('queue-message').innerText = `Please hand ₱${price} to the admin.`;
            });
    }

    // 4. Play/Pause Logic (UI placeholders for now)
    function toggleConnection(action) {
        if (action === 'play') {
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-pause').style.display = 'block';
            document.getElementById('status-badge').className = 'status-badge status-playing';
            document.getElementById('status-badge').innerText = 'Connected';
            fetch(`/api?action=play&mac=${clientMac}`);
        } else {
            document.getElementById('btn-pause').style.display = 'none';
            document.getElementById('btn-play').style.display = 'block';
            document.getElementById('status-badge').className = 'status-badge status-paused';
            document.getElementById('status-badge').innerText = 'Paused';
            fetch(`/api?action=pause&mac=${clientMac}`);
        }
    }

    // 5. Background Poller (Runs every 3 seconds to check database)
    setInterval(() => {
        fetch(`/api?action=status&mac=${clientMac}`)
            .then(res => res.json())
            .then(data => {
                
                if (data.type === 'dashboard') {
                    // User has bought time and is approved
                    showScreen('screen-dashboard');
                } 
                else if (data.type === 'queue') {
                    // User is in the database queue
                    if (!data.data.requested_plan) {
                        // In queue but haven't picked a plan yet
                        if (!document.getElementById('screen-menu').classList.contains('active')) {
                            showScreen('screen-menu');
                        }
                    } else {
                        // Picked a plan and waiting for admin
                        if (!document.getElementById('screen-dashboard').classList.contains('active')) {
                            showScreen('screen-queue');
                            document.getElementById('queue-title').innerText = 'Please Wait';
                            document.getElementById('queue-spinner').style.display = 'none';
                            document.getElementById('queue-message').innerText = `You are #${data.position} in line. Hand payment to admin.`;
                            document.getElementById('btn-join-queue').style.display = 'none';
                        }
                    }
                } 
                else {
                    // Completely new user!
                    // If they are already looking at the rates menu, don't interrupt them
                    if (!document.getElementById('screen-menu').classList.contains('active')) {
                        showScreen('screen-queue');
                        document.getElementById('queue-title').innerText = 'Welcome';
                        document.getElementById('queue-spinner').style.display = 'none';
                        document.getElementById('queue-message').innerText = 'Click below to view internet rates.';
                        document.getElementById('btn-join-queue').style.display = 'block';
                    }
                }

            })
            .catch(err => console.error("API Error:", err));
    }, 3000);
</script>

</body>
</html>
