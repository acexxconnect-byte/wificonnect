<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Portal | Gaming Hub</title>
    
    <!-- Import futuristic gaming fonts from Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --bg-dark: #07070a;
            --panel-bg: #111116;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at top right, rgba(0, 243, 255, 0.05), transparent 40%),
                radial-gradient(circle at bottom left, rgba(255, 0, 255, 0.05), transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(17, 17, 22, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.05), inset 0 0 15px rgba(0, 0, 0, 0.5);
            padding: 30px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative top accent for the container */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        }

        .screen { display: none; animation: fadeIn 0.3s ease-out; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h2 { 
            font-family: 'Orbitron', sans-serif; 
            margin-top: 0; 
            color: #fff; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .mac-display { 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem; 
            color: var(--neon-blue); 
            margin-bottom: 25px; 
            padding: 5px 10px;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 4px;
            display: inline-block;
            letter-spacing: 1px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .tier-header {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.15), transparent);
            color: var(--neon-blue);
            padding: 8px;
            margin: 20px 0 10px 0;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
        }
        
        .vip-header {
            background: linear-gradient(90deg, transparent, rgba(255, 0, 255, 0.15), transparent);
            color: var(--neon-pink);
            border-bottom: 1px solid rgba(255, 0, 255, 0.3);
        }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-rate {
            font-family: 'Rajdhani', sans-serif;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 12px 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
            transition: all 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .btn-rate:hover { 
            border-color: var(--neon-blue); 
            background: rgba(0, 243, 255, 0.1); 
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }
        
        .btn-rate:active {
            transform: scale(0.96);
        }

        .price { 
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue); 
            font-size: 1.2rem; 
            display: block; 
            margin-top: 6px; 
            font-weight: 700;
        }

        /* VIP Buttons override */
        .vip-btn { border-color: rgba(255, 0, 255, 0.3); }
        .vip-btn:hover {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3), inset 0 0 10px rgba(255, 0, 255, 0.2);
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.5);
        }
        .vip-btn .price { color: var(--neon-pink); }

        .time-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            letter-spacing: 2px;
        }

        .status-badge {
            font-family: 'Orbitron', sans-serif;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid transparent;
        }

        .status-playing { 
            background: rgba(57, 255, 20, 0.1); 
            color: var(--neon-green); 
            border-color: rgba(57, 255, 20, 0.5);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            text-shadow: 0 0 5px var(--neon-green);
        }

        .status-paused { 
            background: rgba(255, 0, 255, 0.1); 
            color: var(--neon-pink); 
            border-color: rgba(255, 0, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
            text-shadow: 0 0 5px var(--neon-pink);
        }
        
        .btn-action {
            font-family: 'Orbitron', sans-serif;
            width: 100%;
            padding: 16px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-action:active { transform: scale(0.98); }

        .btn-play { 
            border-color: var(--neon-green); 
            color: var(--neon-green);
            background: rgba(57, 255, 20, 0.05);
        }
        .btn-play:hover {
            background: rgba(57, 255, 20, 0.15);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4), inset 0 0 10px rgba(57, 255, 20, 0.2);
            text-shadow: 0 0 8px var(--neon-green);
        }

        .btn-pause { 
            border-color: var(--neon-pink); 
            color: var(--neon-pink);
            background: rgba(255, 0, 255, 0.05);
        }
        .btn-pause:hover {
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4), inset 0 0 10px rgba(255, 0, 255, 0.2);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .btn-buy-more { 
            border-color: var(--neon-blue); 
            color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.05);
        }
        .btn-buy-more:hover {
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(0, 243, 255, 0.1);
            border-top: 3px solid var(--neon-blue);
            border-right: 3px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 25px auto;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); filter: hue-rotate(0deg); } 
            100% { transform: rotate(360deg); filter: hue-rotate(45deg); } 
        }

        p { color: var(--text-muted); font-size: 1.05rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="mac-display" id="mac-address-label">DEVICE: UNKNOWN</div>

    <!-- SCREEN 1: LOADING & QUEUE -->
    <div id="screen-queue" class="screen active">
        <h2 id="queue-title">System Uplink...</h2>
        <div class="spinner" id="queue-spinner"></div>
        <p id="queue-message">Synchronizing device metrics.</p>
        <button class="btn-action btn-buy-more" id="btn-join-queue" style="display:none;" onclick="joinQueue()">INITIALIZE CONNECTION</button>
    </div>

    <!-- SCREEN 2: RATE MENU -->
    <div id="screen-menu" class="screen">
        <h2>Select Protocol</h2>
        <p style="font-size: 0.95rem;">Transfer credits to the network admin to proceed.</p>
        
        <div class="tier-header">📶 STANDARD NODE (5 Mbps)</div>
        <div class="grid-menu">
            <button class="btn-rate" onclick="requestPlan('1H_5M', 5)">1 Hour <span class="price">₱5</span></button>
            <button class="btn-rate" onclick="requestPlan('3H_5M', 10)">3 Hours <span class="price">₱10</span></button>
            <button class="btn-rate" onclick="requestPlan('10H_5M', 20)">10 Hours <span class="price">₱20</span></button>
            <button class="btn-rate" onclick="requestPlan('1D_5M', 30)">1 Day <span class="price">₱30</span></button>
        </div>

        <div class="tier-header vip-header">⭐ VIP OVERCLOCK (10 Mbps)</div>
        <div class="grid-menu">
            <button class="btn-rate vip-btn" onclick="requestPlan('3D_10M', 60)">3 Days <span class="price">₱60</span></button>
            <button class="btn-rate vip-btn" onclick="requestPlan('7D_10M', 130)">7 Days <span class="price">₱130</span></button>
            <button class="btn-rate vip-btn" onclick="requestPlan('15D_10M', 250)">15 Days <span class="price">₱250</span></button>
            <button class="btn-rate vip-btn" onclick="requestPlan('30D_10M', 450)">30 Days <span class="price">₱450</span></button>
        </div>
    </div>

    <!-- SCREEN 3: DASHBOARD (PLAY/PAUSE) -->
    <div id="screen-dashboard" class="screen">
        <h2>Network Status</h2>
        <div id="status-badge" class="status-badge status-paused">OFFLINE</div>
        
        <div class="time-display" id="time-remaining">00:00</div>
        <p style="margin-top: -10px; margin-bottom: 25px; font-weight: 600; letter-spacing: 1px;">TIME REMAINING</p>

        <button class="btn-action btn-play" id="btn-play" onclick="toggleConnection('play')">▶ EXECUTE (PLAY)</button>
        <button class="btn-action btn-pause" id="btn-pause" onclick="toggleConnection('pause')" style="display:none;">⏸ HALT (PAUSE)</button>
        <button class="btn-action btn-buy-more" onclick="joinQueue()" style="margin-top: 15px;">➕ UPLOAD MORE TIME</button>
    </div>
</div>

<script>
    // 1. Capture the MAC address Omada puts in the URL
    const urlParams = new URLSearchParams(window.location.search);
    let clientMac = urlParams.get('clientMac');
    
    // Fallback logic for testing without Omada
    if (!clientMac) {
        clientMac = localStorage.getItem('saved_mac') || 'TEST-MAC-' + Math.floor(Math.random() * 1000);
    }
    localStorage.setItem('saved_mac', clientMac);
    document.getElementById('mac-address-label').innerText = 'DEVICE ID: ' + clientMac;

    // 2. Screen Navigation Function
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 3. Queue Logic
    function joinQueue() {
        // Just show the menu immediately. Don't hit the database yet.
        showScreen('screen-menu');
    }

    function requestPlan(planCode, price) {
        showScreen('screen-queue');
        document.getElementById('queue-title').innerText = 'Connecting...';
        document.getElementById('queue-spinner').style.display = 'block';
        document.getElementById('queue-message').innerText = `Requesting ₱${price} plan...`;
        
        // Join the line in the background, then update with the requested plan
        fetch(`/api?action=join&mac=${clientMac}`)
            .then(() => fetch(`/api?action=request&mac=${clientMac}&plan=${planCode}`))
            .then(() => {
                document.getElementById('queue-title').innerText = 'Waiting for Approval';
                document.getElementById('queue-spinner').style.display = 'none';
                document.getElementById('queue-message').innerText = `Please hand ₱${price} to the admin.`;
            });
    }

    // 4. Play/Pause Logic (UI placeholders for now)
    function toggleConnection(action) {
        if (action === 'play') {
            document.getElementById('btn-play').style.display = 'none';
            document.getElementById('btn-pause').style.display = 'block';
            document.getElementById('status-badge').className = 'status-badge status-playing';
            document.getElementById('status-badge').innerText = 'Connected';
            fetch(`/api?action=play&mac=${clientMac}`);
        } else {
            document.getElementById('btn-pause').style.display = 'none';
            document.getElementById('btn-play').style.display = 'block';
            document.getElementById('status-badge').className = 'status-badge status-paused';
            document.getElementById('status-badge').innerText = 'Paused';
            fetch(`/api?action=pause&mac=${clientMac}`);
        }
    }

    // 5. Background Poller (Runs every 3 seconds to check database)
    setInterval(() => {
        fetch(`/api?action=status&mac=${clientMac}`)
            .then(res => res.json())
            .then(data => {
                
                if (data.type === 'dashboard') {
                    // User has bought time and is approved
                    showScreen('screen-dashboard');
                } 
                else if (data.type === 'queue') {
                    // User is in the database queue
                    if (!data.data.requested_plan) {
                        // In queue but haven't picked a plan yet
                        if (!document.getElementById('screen-menu').classList.contains('active')) {
                            showScreen('screen-menu');
                        }
                    } else {
                        // Picked a plan and waiting for admin
                        if (!document.getElementById('screen-dashboard').classList.contains('active')) {
                            showScreen('screen-queue');
                            document.getElementById('queue-title').innerText = 'Please Wait';
                            document.getElementById('queue-spinner').style.display = 'none';
                            document.getElementById('queue-message').innerText = `You are #${data.position} in line. Hand payment to admin.`;
                            document.getElementById('btn-join-queue').style.display = 'none';
                        }
                    }
                } 
                else {
                    // Completely new user!
                    // If they are already looking at the rates menu, don't interrupt them
                    if (!document.getElementById('screen-menu').classList.contains('active')) {
                        showScreen('screen-queue');
                        document.getElementById('queue-title').innerText = 'Welcome';
                        document.getElementById('queue-spinner').style.display = 'none';
                        document.getElementById('queue-message').innerText = 'Click below to view internet rates.';
                        document.getElementById('btn-join-queue').style.display = 'block';
                    }
                }

            })
            .catch(err => console.error("API Error:", err));
    }, 3000);
</script>

</body>
</html>
